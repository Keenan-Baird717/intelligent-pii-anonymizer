name: Backend CI

on:
  push:
    paths:
      - "apps/api/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
      - ".github/dependabot.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pii
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: pii_anonymizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pii -d pii_anonymizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://pii:test_password@localhost:5432/pii_anonymizer
      TEMP_UPLOAD_DIR: /tmp/pii-uploads-ci
      OCR_TEMP_DIR: /tmp/pii-uploads-ci/ocr-work
      OCR_ENABLED: "true"
      UPLOAD_CLEANUP_ENABLED: "false"
      UPLOAD_CLEANUP_INTERVAL_SECONDS: "0"
      MAX_UPLOAD_BYTES: "20971520"
      ALLOWED_HOSTS: localhost,127.0.0.1,api,testserver
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs | grep eng
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Alembic migrate
        run: alembic upgrade head
      - name: Pytest
        run: pytest tests/ -v -rs
      - name: pip-audit
        run: pip-audit --strict --desc on || pip-audit --desc on
      - name: Bandit
        run: bandit -r app -ll -x tests
      - name: Confirm no tracked uploads or OCR work files
        working-directory: .
        run: |
          ! git ls-files | grep -E '(^|/)(uploads|ocr-work)/' || (echo "Tracked upload/OCR paths found" && exit 1)
          ! git ls-files | grep -E '\.(pdf|png|jpg|jpeg)$' | grep -v 'samples/fictional' || true
