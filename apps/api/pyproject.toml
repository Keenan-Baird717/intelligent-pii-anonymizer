[project]
name = "pii-anonymizer-api"
version = "0.1.0"
description = "Intelligent PII Anonymization Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.142",
    "uvicorn[standard]>=0.32.0,<0.55",
    "starlette>=0.49.1",
    "pydantic-settings>=2.6.0,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.19",
    "psycopg[binary]>=3.2.0,<4",
    "structlog>=24.4.0,<27",
    "presidio-analyzer>=2.2.354,<3",
    "spacy>=3.7.0,<3.9",
    "pymupdf>=1.26.7,<1.27",
    "pillow>=12.3.0,<13",
    "python-multipart>=0.0.31,<0.1",
    "opencv-python-headless>=4.10.0,<4.13",
    "numpy>=1.26.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/File defaults are intentional

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer",
    "presidio_analyzer.*",
    "spacy",
    "spacy.*",
    "fitz",
    "PIL",
    "PIL.*",
    "cv2",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
